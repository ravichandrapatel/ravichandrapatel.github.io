<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1016"/><stop offset="100%" stop-color="#121a24"/>
    </linearGradient>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(232,238,246,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/><rect width="1600" height="900" fill="url(#g)"/>
  <circle cx="260" cy="180" r="180" fill="rgba(91,159,212,0.16)"/>
  <circle cx="1340" cy="720" r="200" fill="rgba(62,207,142,0.12)"/>
  <text x="160" y="130" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700" fill="#3ecf8e" letter-spacing="0.14em">CLOUD-DISPATCH</text>
  <text x="160" y="200" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" fill="#9aabbf">Building an IDP on a Shoestring</text>
  <text x="160" y="300" font-family="ui-sans-serif,system-ui,sans-serif" font-size="64" font-weight="800" fill="#e8eef6">Why control and workload</text>
  <text x="160" y="380" font-family="ui-sans-serif,system-ui,sans-serif" font-size="64" font-weight="800" fill="#e8eef6">must live apart</text>
  <!-- three equal cards, inset 160..1440 -->
  <rect x="160" y="470" width="360" height="280" rx="18" fill="#1a2533" stroke="#5b9fd4" stroke-width="3"/>
  <text x="190" y="530" font-family="ui-monospace,monospace" font-size="22" fill="#5b9fd4">CONTROL</text>
  <text x="190" y="595" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700" fill="#e8eef6">gh-platform-control</text>
  <text x="190" y="650" font-family="ui-monospace,monospace" font-size="20" fill="#9aabbf">Issues / catalog / App</text>
  <text x="190" y="690" font-family="ui-monospace,monospace" font-size="20" fill="#9aabbf">no cloud OIDC</text>
  <path d="M540 610 H580" stroke="#3ecf8e" stroke-width="4"/><polygon points="580,598 610,610 580,622" fill="#3ecf8e"/>
  <rect x="620" y="470" width="360" height="280" rx="18" fill="#1a2533" stroke="#3ecf8e" stroke-width="3"/>
  <text x="650" y="530" font-family="ui-monospace,monospace" font-size="22" fill="#3ecf8e">WORKLOAD</text>
  <text x="650" y="595" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700" fill="#e8eef6">infra-dev / prod</text>
  <text x="650" y="650" font-family="ui-monospace,monospace" font-size="20" fill="#9aabbf">stacks / Environments</text>
  <text x="650" y="690" font-family="ui-monospace,monospace" font-size="20" fill="#9aabbf">OIDC apply</text>
  <path d="M1000 610 H1040" stroke="#3ecf8e" stroke-width="4"/><polygon points="1040,598 1070,610 1040,622" fill="#3ecf8e"/>
  <rect x="1080" y="470" width="360" height="280" rx="18" fill="#121a24" stroke="rgba(232,238,246,0.4)" stroke-width="3"/>
  <text x="1110" y="530" font-family="ui-monospace,monospace" font-size="22" fill="#9aabbf">CLOUD</text>
  <text x="1110" y="610" font-family="ui-sans-serif,system-ui,sans-serif" font-size="36" font-weight="700" fill="#e8eef6">account</text>
  <text x="1110" y="670" font-family="ui-monospace,monospace" font-size="20" fill="#9aabbf">apply lands here</text>
