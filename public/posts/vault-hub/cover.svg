<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-label="Vault Hub architecture cover">
  <!--
    architecture.png layout on 16:9 dark canvas
    margins: 120 · diagram fills remaining band
    L x=120 w=240 · Hub x=520 w=400 · R x=1080 w=400
    vertical: OIDC above hub · hub/clusters/consumers share y=260..700
  -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1219"/>
      <stop offset="100%" stop-color="#0b1016"/>
    </linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#9aabbf"/>
    </marker>
    <marker id="arrG" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#3ecf8e"/>
    </marker>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- Brand (single line, top-left of diagram margin) -->
  <text x="120" y="70" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" font-weight="700" fill="#3ecf8e" letter-spacing="0.16em">CLOUD-DISPATCH</text>
  <text x="120" y="108" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700" fill="#e8eef6">Vault Hub architecture</text>
  <text x="120" y="142" font-family="ui-sans-serif,system-ui,sans-serif" font-size="18" fill="#9aabbf">Clusters authenticate in · short-lived credentials out</text>

  <!-- ========== OIDC (same width + x as Hub) ========== -->
  <rect x="520" y="180" width="400" height="68" rx="14" fill="#161e28" stroke="#3a4656" stroke-width="2"/>
  <rect x="548" y="198" width="30" height="30" rx="5" fill="#0078d4"/>
  <text x="554" y="219" font-family="ui-sans-serif,system-ui,sans-serif" font-size="13" font-weight="700" fill="#fff">Az</text>
  <circle cx="608" cy="213" r="15" fill="#007dc1"/>
  <text x="601" y="218" font-family="ui-sans-serif,system-ui,sans-serif" font-size="12" font-weight="700" fill="#fff">O</text>
  <text x="636" y="220" font-family="ui-sans-serif,system-ui,sans-serif" font-size="22" font-weight="650" fill="#e8eef6">Azure AD / Okta</text>

  <line x1="720" y1="248" x2="720" y2="288" stroke="#9aabbf" stroke-width="2.25" marker-end="url(#arr)"/>
  <text x="736" y="276" font-family="ui-monospace,monospace" font-size="14" fill="#9aabbf">OIDC SSO</text>

  <!-- ========== Left: EKS / GKE / AKS (same vertical span as Hub) ========== -->
  <!-- Hub y=290 h=420 → 290..710. Three cards: h=116, gap=36 → 3*116+2*36=420 -->
  <g font-family="ui-sans-serif,system-ui,sans-serif">
    <rect x="120" y="290" width="240" height="116" rx="14" fill="#161e28" stroke="#3a4656" stroke-width="2"/>
    <circle cx="178" cy="348" r="22" fill="none" stroke="#326ce5" stroke-width="3.5"/>
    <circle cx="178" cy="348" r="8" fill="#326ce5"/>
    <text x="218" y="358" font-size="30" font-weight="700" fill="#e8eef6">EKS</text>

    <rect x="120" y="442" width="240" height="116" rx="14" fill="#161e28" stroke="#3a4656" stroke-width="2"/>
    <circle cx="178" cy="500" r="20" fill="#4285f4"/>
    <text x="169" y="508" font-size="20" font-weight="800" fill="#fff">G</text>
    <text x="218" y="510" font-size="30" font-weight="700" fill="#e8eef6">GKE</text>

    <rect x="120" y="594" width="240" height="116" rx="14" fill="#161e28" stroke="#3a4656" stroke-width="2"/>
    <rect x="160" y="630" width="34" height="34" rx="5" fill="#0078d4"/>
    <text x="166" y="654" font-size="14" font-weight="700" fill="#fff">Az</text>
    <text x="218" y="662" font-size="30" font-weight="700" fill="#e8eef6">AKS</text>
  </g>

  <!-- JWT arrows to hub left (x=520), mid each card -->
  <line x1="360" y1="348" x2="518" y2="348" stroke="#9aabbf" stroke-width="2.25" marker-end="url(#arr)"/>
  <line x1="360" y1="500" x2="518" y2="500" stroke="#9aabbf" stroke-width="2.25" marker-end="url(#arr)"/>
  <line x1="360" y1="652" x2="518" y2="652" stroke="#9aabbf" stroke-width="2.25" marker-end="url(#arr)"/>
  <text x="380" y="430" font-family="ui-monospace,monospace" font-size="13" fill="#9aabbf">JWT /</text>
  <text x="380" y="450" font-family="ui-monospace,monospace" font-size="13" fill="#9aabbf">AppRole</text>

  <!-- ========== Vault Hub ========== -->
  <rect x="520" y="290" width="400" height="420" rx="20" fill="#1a7f4b"/>
  <!-- logo left -->
  <g transform="translate(560 380)">
    <path d="M80 0 L160 138 L0 138 Z" fill="#fff"/>
    <g fill="#1a7f4b">
      <rect x="58" y="54" width="14" height="14" rx="1"/>
      <rect x="76" y="54" width="14" height="14" rx="1"/>
      <rect x="94" y="54" width="14" height="14" rx="1"/>
      <rect x="58" y="72" width="14" height="14" rx="1"/>
      <rect x="76" y="72" width="14" height="14" rx="1"/>
      <rect x="94" y="72" width="14" height="14" rx="1"/>
      <rect x="58" y="90" width="14" height="14" rx="1"/>
      <rect x="76" y="90" width="14" height="14" rx="1"/>
      <rect x="94" y="90" width="14" height="14" rx="1"/>
    </g>
  </g>
  <!-- copy right of logo, vertically centered with logo -->
  <text x="750" y="430" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" font-weight="800" fill="#fff">Vault Hub</text>
  <line x1="750" y1="450" x2="880" y2="450" stroke="rgba(255,255,255,0.55)" stroke-width="2"/>
  <text x="750" y="488" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" fill="#e8f8ef">Raft HA ×3</text>
  <text x="750" y="516" font-family="ui-sans-serif,system-ui,sans-serif" font-size="17" fill="#e8f8ef">+ Cloud KMS unseal</text>

  <!-- credentials arrow -->
  <line x1="920" y1="500" x2="1078" y2="500" stroke="#3ecf8e" stroke-width="2.25" marker-end="url(#arrG)"/>
  <text x="930" y="478" font-family="ui-monospace,monospace" font-size="13" fill="#3ecf8e">Short-lived</text>
  <text x="930" y="496" font-family="ui-monospace,monospace" font-size="13" fill="#3ecf8e">credentials</text>

  <!-- ========== Consumers (same y/h as Hub) ========== -->
  <rect x="1080" y="290" width="400" height="420" rx="16" fill="#161e28" stroke="#3a4656" stroke-width="2"/>
  <!-- tiers: 420/3 = 140 -->
  <g transform="translate(1128 330)">
    <path d="M8 40 L34 6 L60 40 Z" fill="none" stroke="#5b9fd4" stroke-width="3"/>
    <rect x="20" y="30" width="28" height="16" fill="none" stroke="#5b9fd4" stroke-width="2.5"/>
    <text x="82" y="38" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700" fill="#e8eef6">Apps</text>
  </g>
  <line x1="1110" y1="430" x2="1450" y2="430" stroke="#3a4656" stroke-width="2" stroke-dasharray="8 7"/>

  <g transform="translate(1128 470)">
    <circle cx="34" cy="28" r="24" fill="none" stroke="#3ecf8e" stroke-width="3"/>
    <path d="M34 10 C48 20 48 36 34 46 C20 36 20 20 34 10 Z" fill="#3ecf8e"/>
    <text x="82" y="38" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700" fill="#e8eef6">ESO</text>
  </g>
  <line x1="1110" y1="570" x2="1450" y2="570" stroke="#3a4656" stroke-width="2" stroke-dasharray="8 7"/>

  <g transform="translate(1128 610)">
    <path d="M10 10 H34 V34 H10 Z" fill="#7b42bc"/>
    <path d="M38 10 H62 V34 H38 Z" fill="#5c4ee5"/>
    <path d="M38 38 H62 V62 H38 Z" fill="#7b42bc"/>
    <text x="82" y="42" font-family="ui-sans-serif,system-ui,sans-serif" font-size="28" font-weight="700" fill="#e8eef6">Terraform</text>
  </g>

  <!-- Footer -->
  <text x="800" y="780" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="20" fill="#9aabbf">OSS: path + policy tenancy  ·  Enterprise: namespaces / DR</text>
  <text x="800" y="820" text-anchor="middle" font-family="ui-monospace,monospace" font-size="16" fill="#5b9fd4">identity metadata → one shared policy → allow / 403</text>
</svg>
