<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1016"/>
      <stop offset="100%" stop-color="#121a24"/>
    </linearGradient>
    <pattern id="g" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M48 0H0V48" fill="none" stroke="rgba(232,238,246,0.07)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#g)"/>
  <circle cx="280" cy="200" r="190" fill="rgba(91,159,212,0.16)"/>
  <circle cx="1320" cy="700" r="210" fill="rgba(62,207,142,0.12)"/>

  <text x="160" y="130" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700" fill="#3ecf8e" letter-spacing="0.14em">CLOUD-DISPATCH</text>
  <text x="160" y="200" font-family="ui-sans-serif,system-ui,sans-serif" font-size="34" fill="#9aabbf">Vault OSS · multi-tenant hub</text>
  <text x="160" y="290" font-family="ui-sans-serif,system-ui,sans-serif" font-size="58" font-weight="800" fill="#e8eef6">One Vault. One policy.</text>
  <text x="160" y="365" font-family="ui-sans-serif,system-ui,sans-serif" font-size="58" font-weight="800" fill="#e8eef6">Identity decides the path.</text>

  <!-- Hub -->
  <rect x="160" y="460" width="400" height="300" rx="18" fill="#1a2533" stroke="#5b9fd4" stroke-width="3"/>
  <text x="190" y="520" font-family="ui-monospace,monospace" font-size="22" fill="#5b9fd4">VAULT HUB</text>
  <text x="190" y="585" font-family="ui-sans-serif,system-ui,sans-serif" font-size="30" font-weight="700" fill="#e8eef6">central OSS</text>
  <text x="190" y="640" font-family="ui-monospace,monospace" font-size="20" fill="#9aabbf">identity metadata</text>
  <text x="190" y="680" font-family="ui-monospace,monospace" font-size="20" fill="#9aabbf">shared policy template</text>
  <text x="190" y="720" font-family="ui-monospace,monospace" font-size="20" fill="#9aabbf">no Enterprise namespaces</text>

  <path d="M580 610 H630" stroke="#3ecf8e" stroke-width="4"/>
  <polygon points="630,598 660,610 630,622" fill="#3ecf8e"/>

  <!-- Allow tenant -->
  <rect x="680" y="460" width="360" height="140" rx="16" fill="#1a2533" stroke="#3ecf8e" stroke-width="3"/>
  <text x="710" y="515" font-family="ui-monospace,monospace" font-size="20" fill="#3ecf8e">ALLOW</text>
  <text x="710" y="560" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700" fill="#e8eef6">finance / payment-api</text>

  <!-- Deny tenant -->
  <rect x="680" y="620" width="360" height="140" rx="16" fill="#121a24" stroke="rgba(232,238,246,0.35)" stroke-width="3"/>
  <text x="710" y="675" font-family="ui-monospace,monospace" font-size="20" fill="#9aabbf">DENY · 403</text>
  <text x="710" y="720" font-family="ui-sans-serif,system-ui,sans-serif" font-size="26" font-weight="700" fill="#e8eef6">retail / oms</text>

  <path d="M1060 530 H1110" stroke="#3ecf8e" stroke-width="4"/>
  <polygon points="1110,518 1140,530 1110,542" fill="#3ecf8e"/>
  <path d="M1060 690 H1110" stroke="rgba(232,238,246,0.35)" stroke-width="4" stroke-dasharray="8 8"/>
  <polygon points="1110,678 1140,690 1110,702" fill="rgba(232,238,246,0.35)"/>

  <!-- Secrets paths -->
  <rect x="1160" y="460" width="280" height="300" rx="18" fill="#1a2533" stroke="rgba(232,238,246,0.4)" stroke-width="3"/>
  <text x="1190" y="520" font-family="ui-monospace,monospace" font-size="20" fill="#9aabbf">PATHS</text>
  <text x="1190" y="580" font-family="ui-monospace,monospace" font-size="22" fill="#3ecf8e">test1-ou/…</text>
  <text x="1190" y="630" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="700" fill="#e8eef6">own secrets</text>
  <text x="1190" y="680" font-family="ui-sans-serif,system-ui,sans-serif" font-size="24" font-weight="700" fill="#e8eef6">only</text>
  <text x="1190" y="730" font-family="ui-monospace,monospace" font-size="18" fill="#9aabbf">metadata ACL</text>
</svg>
