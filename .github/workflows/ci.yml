# FILE_NAME: ci.yml
# DESCRIPTION: PR/push build gate for ravichandrapatel.github.io (Astro).
# VERSION: 0.1.0

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          set -euo pipefail
          npm ci

      - name: Audit production dependencies
        run: |
          set -euo pipefail
          npm audit --omit=dev --audit-level=high

      - name: Build
        run: |
          set -euo pipefail
          npm run build
