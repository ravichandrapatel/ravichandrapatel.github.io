# FILE_NAME: deploy.yml
# DESCRIPTION: Build Astro site and deploy to GitHub Pages (push + mid-week schedule).
# VERSION: 0.3.0

name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Rebuild so future-dated posts become live after pubDate.
  # 13:30 UTC = 19:00 IST — Tue–Fri midpoint of 18:30–20:30 IST window.
  schedule:
    - cron: "30 13 * * 2,3,4,5"
  workflow_dispatch:

# Least privilege at workflow root; jobs elevate only what they need.
permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          set -euo pipefail
          npm ci

      - name: Build
        run: |
          set -euo pipefail
          npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
