# FILE_NAME: codeql.yml
# DESCRIPTION: CodeQL on PR changed lines (diff-informed); weekly full baseline.
# VERSION: 0.4.0

name: CodeQL

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.{js,jsx,ts,tsx,astro,mjs,cjs}"
      - "package.json"
      - "package-lock.json"
      - "astro.config.mjs"
      - ".github/workflows/codeql.yml"
  # Full-repo baseline only — not on every push (PRs use diff-informed changed lines).
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Required so CodeQL can fetch the PR diff and restrict alerts to changed lines.
      pull-requests: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          languages: ${{ matrix.language }}
          build-mode: none

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          category: "/language:${{ matrix.language }}"
