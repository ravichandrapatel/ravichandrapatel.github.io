# FILE_NAME: dependabot.yml
# DESCRIPTION: npm + GitHub Actions updates for ravichandrapatel.github.io.
# VERSION: 0.2.0

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 15
    versioning-strategy: increase
    groups:
      production-deps:
        dependency-type: production
      dev-deps:
        dependency-type: development
    labels:
      - dependencies
      - npm
    commit-message:
      prefix: "chore(deps)"
      include: scope

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 15
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(deps)"
      include: scope
